name: PromptDrift
description: Behavioral prompt checks and opt-in repeated-sample drift monitoring
author: PromptDrift contributors
inputs:
  mode:
    description: Execution mode, check or monitor
    required: false
    default: check
  config:
    description: Configuration path, relative to working-directory
    required: false
    default: promptdrift.yaml
  working-directory:
    description: Directory in which to install and run PromptDrift (relative to the workspace)
    required: false
    default: .
  version:
    description: Single pip package spec or local project path (used only when install is true)
    required: false
    default: promptdrift-ci
  install:
    description: Install the version spec; set false to use an already installed CLI
    required: false
    default: 'true'
  base-ref:
    description: Git base ref for selective check; auto-detected on PRs and ignored in monitor mode
    required: false
    default: ''
  samples:
    description: Samples per test in monitor mode, integer from 1 to 20
    required: false
    default: '3'
  upload-report:
    description: Upload the JSON report as a workflow artifact
    required: false
    default: 'true'
  artifact-name:
    description: Artifact name; choose distinct names for multiple Action invocations in one workflow run
    required: false
    default: promptdrift-report
  comment:
    description: Update one marked PR comment (same-repository pull_request events only)
    required: false
    default: 'false'
  create-issue:
    description: Opt in to deduplicated monitor failure issues on schedule or workflow_dispatch events
    required: false
    default: 'false'
  issue-scope:
    description: Additional stable alert namespace for jobs sharing a configuration path
    required: false
    default: ''
outputs:
  result:
    description: Absolute path to the Action JSON report, including on CLI failure
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: CLI exit code (or 2 for Action input/installation/invalid successful JSON errors)
    value: ${{ steps.run.outputs.exit_code }}
runs:
  using: composite
  steps:
    - name: Run PromptDrift and prepare reports
      id: run
      shell: bash
      env:
        PROMPTDRIFT_ACTION_PATH: ${{ github.action_path }}
        PROMPTDRIFT_MODE: ${{ inputs.mode }}
        PROMPTDRIFT_CONFIG: ${{ inputs.config }}
        PROMPTDRIFT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PROMPTDRIFT_VERSION: ${{ inputs.version }}
        PROMPTDRIFT_INSTALL: ${{ inputs.install }}
        PROMPTDRIFT_BASE_REF: ${{ inputs.base-ref || github.event.pull_request.base.sha || '' }}
        PROMPTDRIFT_SAMPLES: ${{ inputs.samples }}
        PROMPTDRIFT_ISSUE_SCOPE: ${{ inputs.issue-scope }}
      run: python "$PROMPTDRIFT_ACTION_PATH/run.py"
    - name: Upload PromptDrift report
      if: ${{ always() && inputs.upload-report == 'true' && steps.run.outputs.result != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.result }}
        if-no-files-found: error
    - name: Publish GitHub notification
      if: ${{ always() && steps.run.outputs.result != '' && ((inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (inputs.create-issue == 'true' && inputs.mode == 'monitor' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.run.outputs.exit_code == '1' || steps.run.outputs.exit_code == '3'))) }}
      uses: actions/github-script@v7
      env:
        PROMPTDRIFT_ACTION_PATH: ${{ github.action_path }}
        PROMPTDRIFT_REPORT: ${{ steps.run.outputs.result }}
        PROMPTDRIFT_SUMMARY: ${{ steps.run.outputs.summary }}
        PROMPTDRIFT_SCOPE: ${{ steps.run.outputs.scope }}
        PROMPTDRIFT_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        PROMPTDRIFT_MODE: ${{ inputs.mode }}
        PROMPTDRIFT_COMMENT: ${{ inputs.comment }}
        PROMPTDRIFT_CREATE_ISSUE: ${{ inputs.create-issue }}
      with:
        script: |
          const path = require('node:path');
          const publish = require(path.join(process.env.PROMPTDRIFT_ACTION_PATH, 'publish.cjs'));
          await publish({github, context, core});
    - name: Enforce PromptDrift result
      if: ${{ always() }}
      shell: bash
      env:
        PROMPTDRIFT_ACTION_PATH: ${{ github.action_path }}
        PROMPTDRIFT_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: python "$PROMPTDRIFT_ACTION_PATH/run.py" --enforce

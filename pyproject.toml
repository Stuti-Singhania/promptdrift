[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptdrift-ci"
dynamic = ["version"]
description = "Detect behavioral drift in LLM applications under unchanged monitored inputs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tanveer", email = "tanveer.arch@users.noreply.github.com"}]
keywords = ["llm", "model-drift", "prompt-regression", "github-actions", "monitoring", "ci", "contracts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.22,<5",
  "referencing>=0.35,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/tanveer-arch/promptdrift"
Repository = "https://github.com/tanveer-arch/promptdrift"
Documentation = "https://github.com/tanveer-arch/promptdrift/tree/main/docs"
Issues = "https://github.com/tanveer-arch/promptdrift/issues"
Changelog = "https://github.com/tanveer-arch/promptdrift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "build>=1.2,<2", "twine>=7,<8"]

[project.scripts]
promptdrift = "promptdrift.cli:main"

[tool.hatch.version]
path = "src/promptdrift/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/.github", "/src", "/tests", "/action", "/docs", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/promptdrift.yaml.example"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests requiring a real configured provider"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

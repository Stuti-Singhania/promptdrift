name: Bug Report
description: Report a bug in PromptDrift
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, private prompts or raw provider output.
        Monitoring diagnoses are observations, not proof of a vendor model update. Use synthetic reproductions where possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Create a config with...
        2. Run `promptdrift test`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `promptdrift.yaml` (remove any sensitive data)
      render: yaml

  - type: input
    id: version
    attributes:
      label: PromptDrift Version
      description: Output of `promptdrift version`
      placeholder: "Output of promptdrift version"
    validations:
      required: true

  - type: textarea
    id: monitoring
    attributes:
      label: Monitoring evidence (if applicable)
      description: Include the diagnosis, sample/failure counts, baseline schema version and which fingerprints changed. Remove private identifiers/paths. Do not attach raw test/check JSON without review.

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.11.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mock
        - openai
        - ollama
    validations:
      required: true

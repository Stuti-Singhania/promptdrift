name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - name: Verify tag matches the single-source package version
        run: |
          python - <<'PY'
          import os
          from promptdrift import __version__
          if os.environ['GITHUB_REF_NAME'] != f'v{__version__}':
              raise SystemExit('Release tag does not match the package version')
          PY
      - run: python -m pytest -q
      - run: python -m ruff check src tests action
      - run: python -m ruff format --check src tests action
      - run: node --check action/publish.cjs
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/promptdrift-ci
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
